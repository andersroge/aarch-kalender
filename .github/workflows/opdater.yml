name: Opdater kalender

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  byg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byg kalender
        env:
          MOODLE_URL: ${{ secrets.MOODLE_URL }}
        run: python generate.py
      - name: Gem resultat
        run: |
          git config user.name "kalender-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || (git commit -m "Opdater kalender" && git push)
